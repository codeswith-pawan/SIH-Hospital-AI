# ==============================================================================
# SIH HOSPITAL AI — PRODUCTION DOCKER COMPOSE CONFIGURATION
# 5 Independent Containerized Services with Network & Volume Isolation
# ==============================================================================

services:
  # 1. PostgreSQL Database Cluster (Not exposed publicly)
  postgres:
    image: postgres:17-alpine
    container_name: sih_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sih_hospital_prod}
      POSTGRES_USER: ${POSTGRES_USER:-sih_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sih_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Distributed Rate Limiter (Not exposed publicly)
  redis:
    image: redis:7-alpine
    container_name: sih_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Redis password required}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - sih_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI ASGI Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sih_backend_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sih_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sih_hospital_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_REQUIRED: "true"
      STORAGE_BASE_DIR: /var/lib/sih/documents
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/var/lib/sih/documents
    networks:
      - sih_internal
      - sih_public

  # 4. Standalone Transactional Email Outbox Worker
  outbox_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sih_outbox_worker_prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sih_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sih_hospital_prod}
      OUTBOX_POLL_INTERVAL: "5.0"
      OUTBOX_BATCH_SIZE: "25"
    command: ["python", "-m", "src.workers.outbox_worker"]
    networks:
      - sih_internal
    healthcheck:
      test: ["CMD", "python", "-m", "src.workers.outbox_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 5. Standalone Automated Bed Reservation Expiry Worker
  reservation_expiry_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sih_reservation_expiry_worker_prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sih_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sih_hospital_prod}
      RESERVATION_EXPIRY_POLL_INTERVAL: "30.0"
      RESERVATION_EXPIRY_BATCH_SIZE: "100"
    command: ["python", "-m", "src.workers.reservation_expiry_worker"]
    networks:
      - sih_internal
    healthcheck:
      test: ["CMD", "python", "-m", "src.workers.reservation_expiry_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # 6. Next.js Web Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sih_frontend_prod
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    networks:
      - sih_public
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  document_storage:

networks:
  sih_internal:
    internal: true
  sih_public:
    driver: bridge
